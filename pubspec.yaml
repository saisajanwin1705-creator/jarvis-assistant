name: jarvis_assistant
description: Standalone JARVIS AI Assistant with floating Arc Reactor HUD.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_overlay_window: ^0.4.6
  llama_cpp_dart: ^0.2.0
  piper_tts: ^0.1.0
  speech_to_text: ^7.0.0
  audioplayers: ^6.0.0
  permission_handler: ^11.3.0
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
